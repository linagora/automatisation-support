# Documentation site with optional OIDC authentication
#
# Without auth:
#   docker compose up -d
#
# With OIDC auth:
#   docker compose --profile auth up -d
#   (requires OIDC_* variables - see .env.example)

services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:80"

  # OAuth2 Proxy - protects the docs site with OIDC when the auth profile is active
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    profiles:
      - auth
    ports:
      - "4000:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: ${OIDC_REDIRECT_URI:-http://localhost:4000/oauth2/callback}
      OAUTH2_PROXY_UPSTREAM: http://docs:80
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_COOKIE_SECRET: ${SESSION_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    depends_on:
      - docs
